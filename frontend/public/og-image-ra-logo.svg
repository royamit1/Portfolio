<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B4B8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D3058;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-opacity="0.5"/>
    </filter>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B5B95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B4B8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Background Pattern (optional subtle dots) -->
  <circle cx="100" cy="100" r="2" fill="#7C6BA5" opacity="0.3"/>
  <circle cx="200" cy="150" r="2" fill="#7C6BA5" opacity="0.3"/>
  <circle cx="300" cy="80" r="2" fill="#7C6BA5" opacity="0.3"/>
  <circle cx="900" cy="120" r="2" fill="#7C6BA5" opacity="0.3"/>
  <circle cx="1000" cy="200" r="2" fill="#7C6BA5" opacity="0.3"/>
  <circle cx="1100" cy="150" r="2" fill="#7C6BA5" opacity="0.3"/>
  
  <!-- Card Container -->
  <rect x="300" y="115" width="600" height="400" rx="40" fill="url(#cardGradient)" filter="url(#shadow)" stroke="#8B7BB8" stroke-width="2"/>
  
  <!-- RA Letters with 3D effect -->
  <g transform="translate(600, 315)">
    <!-- Shadow layers for 3D effect -->
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="280" font-weight="900" fill="#2D1F47" opacity="0.6">RA</text>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="280" font-weight="900" fill="#3D2F57" opacity="0.8">RA</text>
    
    <!-- Main text -->
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="280" font-weight="900" fill="#FFFFFF">RA</text>
  </g>
  
  <!-- Subtle highlight line on card -->
  <line x1="320" y1="135" x2="880" y2="135" stroke="#9B8BC8" stroke-width="1" opacity="0.5"/>
  
  <!-- Bottom accent -->
  <rect x="450" y="470" width="300" height="4" rx="2" fill="#8B7BB8" opacity="0.6"/>
</svg>