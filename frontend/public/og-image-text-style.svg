<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="techGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#0099cc;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0066aa;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Tech Circuit Lines (bottom) -->
  <g opacity="0.6">
    <!-- Horizontal lines -->
    <path d="M 0 500 L 200 500 L 220 480 L 350 480" stroke="url(#techGlow)" stroke-width="2" fill="none"/>
    <path d="M 150 520 L 400 520 L 420 540 L 550 540" stroke="url(#techGlow)" stroke-width="2" fill="none"/>
    <path d="M 300 560 L 500 560 L 520 540 L 650 540" stroke="url(#techGlow)" stroke-width="2" fill="none"/>
    
    <!-- Right side -->
    <path d="M 650 480 L 800 480 L 820 500 L 1000 500" stroke="url(#techGlow)" stroke-width="2" fill="none"/>
    <path d="M 750 520 L 900 520 L 920 540 L 1100 540" stroke="url(#techGlow)" stroke-width="2" fill="none"/>
    <path d="M 700 560 L 850 560 L 870 540 L 1200 540" stroke="url(#techGlow)" stroke-width="2" fill="none"/>
    
    <!-- Vertical connections -->
    <path d="M 400 520 L 400 480 L 420 460 L 420 500" stroke="url(#techGlow)" stroke-width="1.5" fill="none"/>
    <path d="M 800 480 L 800 520 L 820 540 L 820 500" stroke="url(#techGlow)" stroke-width="1.5" fill="none"/>
    
    <!-- Circuit nodes -->
    <circle cx="220" cy="480" r="4" fill="#00d9ff" opacity="0.8"/>
    <circle cx="420" cy="540" r="4" fill="#00d9ff" opacity="0.8"/>
    <circle cx="520" cy="540" r="4" fill="#00d9ff" opacity="0.8"/>
    <circle cx="820" cy="500" r="4" fill="#00d9ff" opacity="0.8"/>
    <circle cx="920" cy="540" r="4" fill="#00d9ff" opacity="0.8"/>
    
    <!-- Glow effects -->
    <circle cx="220" cy="480" r="8" fill="#00d9ff" opacity="0.3"/>
    <circle cx="820" cy="500" r="8" fill="#00d9ff" opacity="0.3"/>
  </g>
  
  <!-- Main Text -->
  <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
    Roy Amit
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#94a3b8">
    Full-Stack Developer
  </text>
  
  <!-- Bottom glow accent -->
  <rect x="0" y="550" width="1200" height="80" fill="url(#techGlow)" opacity="0.2"/>
</svg>