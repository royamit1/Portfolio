<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the main face -->
    <linearGradient id="isoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;" />
      <stop offset="100%" style="stop-color:#4338CA;" />
    </linearGradient>

    <!-- Mask to cut out the letters -->
    <mask id="textMask">
      <rect width="128" height="128" fill="white" />
      <text x="46" y="88" font-family="'Inter', system-ui, sans-serif" font-size="48" font-weight="700" fill="black">A</text>
      <text x="82" y="68" font-family="'Inter', system-ui, sans-serif" font-size="48" font-weight="700" fill="black">R</text>
    </mask>
  </defs>

  <!-- Drop shadow for depth -->
  <g filter="url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\'><filter id=\'shadow\'><feDropShadow dx=\'0\' dy=\'4\' stdDeviation=\'4\' flood-color=\'rgba(0,0,0,0.3)\'/></filter></svg>#shadow')">
    
    <!-- Group for the cube, to apply the mask -->
    <g mask="url(#textMask)">
      <!-- Left Face -->
      <polygon points="64,32 32,48 32,80 64,96" fill="#4338CA" />
      <!-- Top Face -->
      <polygon points="64,32 96,48 64,64 32,48" fill="#4c1d95" />
      <!-- Right Face (with gradient) -->
      <polygon points="64,32 96,48 96,80 64,96" fill="url(#isoGradient)" />
    </g>
  </g>
</svg>
