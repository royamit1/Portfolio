version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # We pass all secrets via the .env file, which docker-compose reads by default
    env_file:
      - ./.env
    # We override ONLY the variables that need to change for the container environment
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - portfolio-network

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      - portfolio-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  portfolio-network:
    driver: bridge
