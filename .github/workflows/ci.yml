name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    # Optional: Only run if files in 'backend' change
    paths: [ "backend/**", ".github/workflows/ci.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "backend/**", ".github/workflows/ci.yml" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # [CRITICAL FIX] Tell GitHub to run all steps inside the 'backend' folder
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with Pytest
        env:
          OPENAI_API_KEY: "sk-dummy-key-for-testing"
          MAIL_USERNAME: "test@example.com"
          MAIL_PASSWORD: "test-password"
          MAIL_FROM: "test@example.com"
          MAIL_SERVER: "localhost"
          OWNER_EMAIL: "owner@example.com"
          REDIS_HOST: "localhost"
          POSTGRES_HOST: "localhost"
        run: |
          pytest tests/ -v

  build-check:
    needs: test
    runs-on: ubuntu-latest

    # [CRITICAL FIX] Set working directory for this job too
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        # Now this runs inside 'backend/', so it finds the Dockerfile correctly
        run: docker build . --file Dockerfile